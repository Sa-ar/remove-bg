services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:7860"
    env_file:
      - ./apps/api/.env
    environment:
      WEB_ORIGIN: http://localhost:3000
    volumes:
      - rembg-models:/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/v1/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  rembg-models:
