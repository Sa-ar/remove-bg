name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          UI_TOKEN_SECRET: ci-placeholder-secret
          NEXT_PUBLIC_API_URL: http://localhost:8000

  api:
    name: API import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install lightweight deps for import check
        run: |
          pip install fastapi uvicorn python-multipart python-dotenv PyJWT slowapi pydantic-settings pillow
          # rembg/onnxruntime are heavy; syntax-check the app module without loading the model
      - name: Compile API sources
        run: python -m compileall -q app
